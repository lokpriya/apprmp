<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>अफलाइन — LGPAS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #182433 0%, #1a2d45 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      padding: 1rem;
    }
    .card {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      max-width: 360px;
      width: 100%;
      text-align: center;
    }
    .icon { font-size: 3rem; margin-bottom: 1rem; }
    h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem; }
    p { font-size: 0.875rem; color: rgba(255,255,255,0.6); line-height: 1.6; margin-bottom: 1.5rem; }
    button {
      background: #206bc4;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0.75rem 1.5rem;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
    button:hover { background: #1a5ba8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>इन्टरनेट छैन</h1>
    <p>
      तपाईंको यन्त्र अहिले अफलाइन छ।<br>
      इन्टरनेट जडान पुनः स्थापित गरेपछि फेरि प्रयास गर्नुहोस्।
    </p>
    <button onclick="location.reload()">पुनः प्रयास गर्नुहोस्</button>
  </div>
</body>
</html>
