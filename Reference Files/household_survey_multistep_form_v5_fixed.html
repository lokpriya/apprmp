<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Household Survey Multi-Step Dynamic Form</title>
<style>
:root { --bg:#f6f8fb; --card:#ffffff; --line:#d9e2ef; --text:#16324f; --muted:#60758a; --primary:#0f766e; --primary2:#115e59; --danger:#b91c1c; }
* { box-sizing:border-box; }
body { margin:0; font-family:Arial,Helvetica,sans-serif; background:var(--bg); color:var(--text); }
.app { display:grid; grid-template-columns:320px 1fr; min-height:100vh; }
.sidebar { background:#0b2239; color:#fff; padding:22px 18px; }
.sidebar h1 { margin:0 0 8px; font-size:22px; }
.sidebar p { margin:0 0 16px; color:#c8d5e4; line-height:1.5; font-size:13px; }
.progress { height:10px; background:#173653; border-radius:999px; overflow:hidden; margin:18px 0 20px; }
.progress>div { height:100%; background:linear-gradient(90deg,#22c55e,#14b8a6); width:0%; transition:.25s; }
.step-list { display:flex; flex-direction:column; gap:8px; }
.step-btn { width:100%; text-align:left; background:transparent; color:#d6e1ee; border:1px solid #1f3a57; padding:10px 12px; border-radius:12px; cursor:pointer; }
.step-btn.active { background:#13385b; color:#fff; border-color:#2563eb; }
.step-btn .num { display:inline-flex; width:24px; height:24px; align-items:center; justify-content:center; border-radius:999px; background:#1f3a57; margin-right:8px; font-size:12px; }
.main { padding:28px; }
.topbar { display:flex; gap:12px; align-items:flex-start; justify-content:space-between; margin-bottom:18px; }
.titlebox h2 { margin:0 0 6px; font-size:30px; }
.titlebox p { margin:0; color:var(--muted); max-width:900px; line-height:1.5; }
.actionbar { display:flex; gap:8px; flex-wrap:wrap; }
.btn { border:none; border-radius:10px; padding:10px 14px; font-weight:700; cursor:pointer; }
.btn.primary { background:var(--primary); color:#fff; }
.btn.primary:hover { background:var(--primary2); }
.btn.secondary { background:#e7eef8; color:#16324f; }
.btn.warn { background:#fff7ed; color:#9a3412; }
.btn:disabled { opacity:.5; cursor:not-allowed; }
.card { background:var(--card); border:1px solid var(--line); border-radius:18px; box-shadow:0 8px 24px rgba(15,35,60,.05); }
#formArea { display:flex; flex-direction:column; gap:16px; }
.section-card { padding:18px; }
.section-card h3 { margin:0 0 4px; font-size:18px; text-transform:capitalize; }
.sub { color:var(--muted); font-size:13px; margin-bottom:14px; }
.grid { display:grid; grid-template-columns:repeat(12,1fr); gap:14px; }
.field { grid-column:span 4; }
.field.small { grid-column:span 3; }
.field.full { grid-column:1/-1; }
label { display:block; font-weight:700; margin-bottom:6px; font-size:14px; }
.ne { display:block; color:var(--muted); font-size:12px; font-weight:500; margin-top:2px; }
input, select, textarea { width:100%; border:1px solid #c7d2e0; border-radius:10px; padding:10px 12px; font-size:14px; background:#fff; }
textarea { min-height:86px; resize:vertical; }
input, select, textarea { transition:border-color .15s ease, box-shadow .15s ease; }
input:focus, select:focus, textarea:focus { outline:none; border-color:#2563eb; box-shadow:0 0 0 3px rgba(37,99,235,.12); }
input[readonly], textarea[readonly] { background:#f8fafc; color:#334155; }
.help { color:var(--muted); font-size:12px; margin-top:5px; line-height:1.45; }
.error { color:var(--danger); font-size:12px; margin-top:5px; }
.info { background:#f8fafc; border:1px dashed #bfd0e0; border-radius:12px; padding:12px 14px; white-space:pre-wrap; line-height:1.55; }
.inline-checks { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:8px; }
.check { border:1px solid #d6dfeb; border-radius:10px; padding:8px 10px; display:flex; gap:8px; align-items:flex-start; background:#fff; }
.check input { width:auto; margin-top:2px; }
.section-tag { display:inline-block; font-size:11px; padding:4px 8px; background:#ecfeff; color:#155e75; border-radius:999px; margin-bottom:8px; }
.footer-nav { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:8px; padding:18px; }
.repeat-block { padding:18px; }
.repeat-header, .repeat-title { display:flex; justify-content:space-between; align-items:center; gap:10px; }
.repeat-item { margin-top:14px; padding:16px; border:1px dashed #b9c8d8; border-radius:14px; background:#fbfdff; }
.kv { display:grid; grid-template-columns:minmax(220px,1fr) 2fr; gap:8px 14px; }
.kv > div { padding:8px 0; border-bottom:1px solid #edf2f7; }
.review-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:16px; }
.review-card { padding:18px; }
.toast { position:fixed; right:18px; bottom:18px; background:#0f172a; color:#fff; padding:12px 16px; border-radius:10px; opacity:0; transform:translateY(10px); transition:.2s; pointer-events:none; }
.toast.show { opacity:1; transform:translateY(0); }
@media (max-width:1100px) { .app { grid-template-columns:1fr; } .sidebar { position:sticky; top:0; z-index:10; } }
@media (max-width:780px) { .main { padding:16px; } .grid { grid-template-columns:1fr; } .field,.field.small,.field.full { grid-column:1/-1; } .topbar,.footer-nav { flex-direction:column; align-items:stretch; } }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <h1>Household Survey</h1>
    <p>Dynamic multi-step HTML form generated from the XLSForm structure. Visibility, calculations, filters, repeats, and review are controlled from the survey logic.</p>
    <div class="progress"><div id="progressFill"></div></div>
    <div id="stepList" class="step-list"></div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div class="titlebox">
        <h2 id="stepTitle">Loading...</h2>
        <p id="stepDesc"></p>
      </div>
      <div class="actionbar">
        <button class="btn secondary" id="saveDraftBtn">Save Draft</button>
        <button class="btn secondary" id="loadDraftBtn">Load Draft</button>
        <button class="btn secondary" id="clearDraftBtn">Clear Draft</button>
        <button class="btn secondary" id="exportBtn">Export JSON</button>
      </div>
    </div>
    <div id="formArea"></div>
  </main>
</div>
<div id="toast" class="toast"></div>

  } else if(field.qtype==='email'){
    input=document.createElement('input'); input.type='email'; input.value=value ?? '';
  } else if(field.qtype==='image'){
    input=document.createElement('input'); input.type='file'; input.accept='image/*';
  } else if(field.qtype==='geopoint' || field.qtype==='start-geopoint'){
    input=document.createElement('textarea'); input.placeholder='अक्षांश देशान्तर उचाइ शुद्धता'; input.value=value ?? '';
  } else {
    input=document.createElement('input'); input.type='text'; input.value=value ?? '';
  }
  input.id=label.htmlFor; input.dataset.name=field.name;
  if(isReadOnly(field) && field.qtype!=='image') input.readOnly=true;
  if(field.qtype==='select_multiple'){
    input.addEventListener('change',()=>{ const vals=[...input.querySelectorAll('input[type=checkbox]:checked')].map(x=>x.value); setVal(field.name,vals,ctx); renderStep(); });
  } else if(field.qtype==='image'){
    input.addEventListener('change',e=>{ const file=e.target.files[0]; if(!file) return; const reader=new FileReader(); reader.onload=()=>{ setVal(field.name,reader.result,ctx); showToast('फोटो संलग्न गरियो'); renderStep(); }; reader.readAsDataURL(file); });
  } else if(!input.readOnly){
    const shouldRerenderOnChange = ['select_one','date'].includes(field.qtype);
    if(shouldRerenderOnChange){
      input.addEventListener('change',e=>{ setVal(field.name,e.target.value,ctx); renderStep(); });
    } else {
      input.addEventListener('input',e=>{ setVal(field.name,e.target.value,ctx); });
      input.addEventListener('change',e=>{ setVal(field.name,e.target.value,ctx); renderStep(); });
      input.addEventListener('blur',e=>{ setVal(field.name,e.target.value,ctx); renderStep(); });
    }
  }
  wrap.appendChild(input);
  if(field.hint_en || field.hint_ne){ const help=document.createElement('div'); help.className='help'; help.textContent=[field.hint_ne,field.hint_en].filter(Boolean).join(' | '); wrap.appendChild(help); }
  if(field.calculation){ const help=document.createElement('div'); help.className='help'; help.textContent='स्वचालित रूपमा गणना हुन्छ'; wrap.appendChild(help); }
  const err=document.createElement('div'); err.className='error'; err.id=`${label.htmlFor}_error`; wrap.appendChild(err); return wrap;
}
function rootFields(stepId){ return fields.filter(f=>f.step===stepId && !f.repeat && f.qtype!=='hidden'); }
function repeatNamesInStep(stepId){ return [...new Set(fields.filter(f=>f.step===stepId && f.repeat).map(f=>f.repeat))]; }
function groupKeyForField(field){ const path=(field.path || []).filter(p=>p!==field.repeat); return path.length ? path.join(' › ') : 'Main Section'; }
function prettySectionName(key){ return key.replace(/_/g,' '); }
function addFieldsToSection(container, fieldList, ctx={}){
  const buckets=new Map();
  fieldList.forEach(f=>{ const key=groupKeyForField(f); if(!buckets.has(key)) buckets.set(key,[]); buckets.get(key).push(f); });
  for(const [key, flist] of buckets.entries()){
    const sec=document.createElement('div'); sec.className='section-card card';
    const tag=document.createElement('div'); tag.className='section-tag'; tag.textContent=prettySectionName(key); sec.appendChild(tag);
    const title=document.createElement('h3'); title.textContent=prettySectionName(key); sec.appendChild(title);
    const sub=document.createElement('div'); sub.className='sub'; sub.textContent='फिल्डहरू XLSForm को relevant logic र option filter अनुसार देखिन्छन्।'; sec.appendChild(sub);
    const grid=document.createElement('div'); grid.className='grid'; flist.forEach(f=>grid.appendChild(createFieldEl(f,ctx))); sec.appendChild(grid); container.appendChild(sec);
  }
}
function renderRepeatSection(container, repeatName, stepId){
  const block=document.createElement('div'); block.className='repeat-block card';
  const header=document.createElement('div'); header.className='repeat-header'; header.innerHTML=`<div><h3 style="margin:0">${repeatInfo[repeatName].label || repeatName}</h3><div class="sub">यो दोहोरिने खण्डमा एक वा बढी विवरण थप्नुहोस्।</div></div>`;
  const addBtn=document.createElement('button'); addBtn.className='btn secondary'; addBtn.textContent='रेकर्ड थप्नुहोस्'; addBtn.onclick=()=>{ state.repeats[repeatName].push({}); recomputeAll(); renderStep(); }; header.appendChild(addBtn); block.appendChild(header);
  const items=state.repeats[repeatName] || [];
  if(!items.length){ const info=document.createElement('div'); info.className='info'; info.textContent='अहिलेसम्म कुनै रेकर्ड थपिएको छैन।'; block.appendChild(info); }
  items.forEach((item,index)=>{ const ctx={repeatName,item,index}; const itemWrap=document.createElement('div'); itemWrap.className='repeat-item'; const title=document.createElement('div'); title.className='repeat-title'; title.innerHTML=`<strong>${repeatInfo[repeatName].label || repeatName} #${index+1}</strong>`; const remove=document.createElement('button'); remove.className='btn warn'; remove.textContent='हटाउनुहोस्'; remove.onclick=()=>{ state.repeats[repeatName].splice(index,1); renderStep(); }; title.appendChild(remove); itemWrap.appendChild(title); addFieldsToSection(itemWrap, fields.filter(f=>f.step===stepId && f.repeat===repeatName), ctx); block.appendChild(itemWrap); });
  container.appendChild(block);
}
function validateStep(stepId){
  let ok=true; document.querySelectorAll('.error').forEach(x=>x.textContent='');
  function validateList(fieldList,ctx={}){
    fieldList.forEach(f=>{
      if(!isVisible(f,ctx)) return;
      if(['note','image'].includes(f.qtype)) return;
      const val=getVal(f.name,ctx); const empty=Array.isArray(val)?val.length===0:(val===null || val===undefined || val==='');
      const inputId=`${ctx.repeatName || 'root'}_${f.name}_${ctx.index ?? 'x'}`; const errEl=document.getElementById(inputId+'_error');
      if(f.required && empty){ if(errEl) errEl.textContent='यो फिल्ड अनिवार्य हो।'; ok=false; }
      else if(!empty && f.constraint && !evalExpr(f.constraint,ctx,val)){ if(errEl) errEl.textContent=f.constraint_en || f.constraint_ne || 'मानले तोकिएको सर्त पूरा गरेन।'; ok=false; }
    });
  }
  validateList(rootFields(stepId));
  repeatNamesInStep(stepId).forEach(repeatName => (state.repeats[repeatName]||[]).forEach((item,index)=>validateList(fields.filter(f=>f.step===stepId && f.repeat===repeatName), {repeatName,item,index})));
  return ok;
}
function buildReview(){
  const container=document.createElement('div'); container.className='review-grid';
  steps.filter(s=>s.id!=='review').forEach(step=>{
    const card=document.createElement('div'); card.className='review-card card'; card.innerHTML=`<h3>${step.title}</h3><div class="sub">${step.desc}</div>`;
    const kv=document.createElement('div'); kv.className='kv'; let count=0;
    rootFields(step.id).forEach(f=>{ if(!isVisible(f)) return; const val=getVal(f.name); const empty=Array.isArray(val)?!val.length:(val===null || val===undefined || val===''); if(empty || f.qtype==='image') return; kv.insertAdjacentHTML('beforeend', `<div>${fieldLabel(f).display}</div><div>${mapValueForReview(f,val)}</div>`); count++; });
    repeatNamesInStep(step.id).forEach(repeatName=>{ const n=(state.repeats[repeatName]||[]).length; if(n){ kv.insertAdjacentHTML('beforeend', `<div>${repeatInfo[repeatName].label || repeatName}</div><div>${n} entries</div>`); count++; } });
    if(!count) kv.innerHTML='<div>अहिलेसम्म कुनै देखिने उत्तर भरिएको छैन।</div><div></div>'; card.appendChild(kv); container.appendChild(card);
  });
  return container;
}
function renderStepList(){
  const box=document.getElementById('stepList'); box.innerHTML='';
  steps.forEach((s,i)=>{ const b=document.createElement('button'); b.className='step-btn'+(i===currentStep?' active':''); b.innerHTML=`<span class="num">${i+1}</span>${s.title}`; b.onclick=()=>{ if(i>currentStep && !validateStep(steps[currentStep].id)) return showToast('कृपया पहिले हालको चरण पूरा गर्नुहोस्।'); currentStep=i; renderStep(); }; box.appendChild(b); });
}
function renderStep(){
  recomputeAll(); renderStepList();
  const step=steps[currentStep]; document.getElementById('stepTitle').textContent=step.title; document.getElementById('stepDesc').textContent=step.desc;
  const area=document.getElementById('formArea'); area.innerHTML='';
  if(step.id==='review') area.appendChild(buildReview());
  else { addFieldsToSection(area, rootFields(step.id), {}); repeatNamesInStep(step.id).forEach(rn=>renderRepeatSection(area,rn,step.id)); }
  const nav=document.createElement('div'); nav.className='footer-nav card';
  nav.innerHTML=`<button class="btn secondary" id="prevBtn" ${currentStep===0?'disabled':''}>अघिल्लो</button><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">${step.id==='review' ? '<button class="btn primary" id="submitBtn">जाँच गरी पेश गर्नुहोस्</button>' : `<button class="btn primary" id="nextBtn">${currentStep===steps.length-2 ? 'अन्तिम समीक्षा' : 'अर्को चरण'}</button>`}</div>`;
  area.appendChild(nav);
  document.getElementById('prevBtn').onclick=()=>{ if(currentStep>0){ currentStep--; renderStep(); } };
  const next=document.getElementById('nextBtn'); if(next) next.onclick=()=>{ if(!validateStep(step.id)) return showToast('कृपया देखाइएका त्रुटिहरू सच्याउनुहोस्।'); currentStep=Math.min(currentStep+1,steps.length-1); renderStep(); };
  const submit=document.getElementById('submitBtn'); if(submit) submit.onclick=()=>{ showToast('Form validated. Ready for backend/API submission.'); console.log('Submission payload', structuredClone(state)); };
}
document.getElementById('saveDraftBtn').onclick=()=>{ localStorage.setItem('household-survey-draft-v2', JSON.stringify(state)); showToast('Draft saved'); };
document.getElementById('loadDraftBtn').onclick=()=>{ const raw=localStorage.getItem('household-survey-draft-v2'); if(!raw) return showToast('No saved draft found'); try { const data=JSON.parse(raw); state.root=data.root||{}; Object.keys(state.repeats).forEach(k=>state.repeats[k]=data.repeats?.[k]||[]); recomputeAll(); renderStep(); showToast('Draft loaded'); } catch(e) { showToast('Saved draft could not be loaded'); } };
document.getElementById('clearDraftBtn').onclick=()=>{ localStorage.removeItem('household-survey-draft-v2'); showToast('Draft cleared'); };
document.getElementById('exportBtn').onclick=()=>{ const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='household-survey-data.json'; a.click(); URL.revokeObjectURL(a.href); };
initDefaults(); renderStep();
</script>
